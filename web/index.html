<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>State Space / Robot Simulation</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Keep the loading screen centered even if the stylesheet loads late. */
    html, body { margin: 0; min-height: 100%; background: #050607; }
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      color: #d4af62;
      font: 14px "DejaVu Sans Mono", Consolas, monospace;
      letter-spacing: 0.16em;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main id="game" aria-label="Robot simulator"></main>
  <p id="loading">Loading simulator…</p>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
